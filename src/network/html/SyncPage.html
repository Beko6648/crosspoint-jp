<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>読書データの共有 - Yomuka</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#243444;background:#f5f7fa}section{background:white;border-radius:10px;padding:20px;margin:20px 0}label{display:block;margin:12px 0}button,a{font-size:16px}button{padding:10px 16px;background:#246baf;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px}h2{font-size:20px}#book{overflow-wrap:anywhere}.note{color:#465665;line-height:1.7}</style></head>
<body><a href="/files">ファイル管理に戻る</a><h1>読書データの共有</h1><p id="book">本を確認中…</p>
<section><h2>この本のデータを書き出す</h2><p class="note">共有する種類を選び、JSONファイルをPCやスマートフォンへ保存します。EPUB本体は含みません。</p>
<label><input type="checkbox" value="1" checked> 読書位置</label><label><input type="checkbox" value="2" checked> しおり</label><label><input type="checkbox" value="4" checked> 本の設定</label><label><input type="checkbox" value="8" checked> 本別の読書履歴</label><button id="export" disabled>選んだデータを書き出す</button></section>
<section><h2>この本の共有ファイルを受け取る</h2><p class="note">同じEPUBのJSONを選んでください。同じ本の受信済み共有ファイルは置き換わります。受信後、Wi-Fiを終了して本を開き、端末の「SDで読書データを共有」で内容を確認して取り込みます。</p>
<input id="file" type="file" accept=".json,application/json"><p id="file-info"></p><button id="receive" disabled>共有ファイルを端末へ送る</button></section>
<p id="status" role="status" aria-live="polite"></p>
<script>
const book = new URLSearchParams(location.search).get('book');
const status = document.getElementById('status'), exportButton = document.getElementById('export'), receiveButton = document.getElementById('receive');
let ready=false, busy=false, selectedFile=null, currentBookId=null;
function controls(){exportButton.disabled=!ready||busy;receiveButton.disabled=!ready||busy||!selectedFile;document.getElementById('file').disabled=!ready||busy;document.querySelectorAll('input[type=checkbox]').forEach(el=>el.disabled=busy);}
async function request(url, options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);try{const response=await fetch(url,{...options,signal:controller.signal});const body=await response.blob();return new Response(body,{status:response.status,statusText:response.statusText,headers:response.headers});}finally{clearTimeout(timer);}}
async function checkedResponse(response){if(!response.ok)throw new Error(await response.text());return response;}
async function initialize(){try{if(!book)throw new Error('ファイル管理でEPUBの「共有」を選んでください。');const response=await checkedResponse(await request('/api/sync/book?book='+encodeURIComponent(book),{cache:'no-store'}));const data=await response.json();document.getElementById('book').textContent=data.title+(data.author?' / '+data.author:'');currentBookId=data.bookId;ready=true;}catch(error){status.textContent=error.message;}controls();}
document.getElementById('file').addEventListener('change',async event=>{selectedFile=null;document.getElementById('file-info').textContent='';const file=event.target.files[0];try{if(!file)return;if(!file.size||file.size>65536)throw new Error('共有ファイルは1～65,536バイトです。');const data=JSON.parse(await file.text());if(data.format!=='yomuka-book-snapshot'||data.formatVersion!==1||!data.units)throw new Error('Yomukaの共有ファイルを選んでください。');if(data.bookId!==currentBookId)throw new Error('別の本の共有ファイルです。この本のJSONを選んでください。');selectedFile=file;document.getElementById('file-info').textContent=file.name+' / '+file.size+'バイト';status.textContent='端末へ送っても、読書データの適用はまだ行いません。';}catch(error){status.textContent=error.message;}controls();});
exportButton.addEventListener('click',async()=>{let units=0;document.querySelectorAll('input[type=checkbox]:checked').forEach(el=>units|=Number(el.value));if(!units){status.textContent='1種類以上選んでください。';return;}busy=true;controls();status.textContent='書き出し中…';try{const response=await checkedResponse(await request('/api/sync/export?book='+encodeURIComponent(book)+'&units='+units,{cache:'no-store'}));const blob=await response.blob();const data=JSON.parse(await blob.text());const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=data.bookId+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='共有ファイルをダウンロードしました。';}catch(error){status.textContent=error.message;}finally{busy=false;controls();}});
receiveButton.addEventListener('click',async()=>{if(!selectedFile)return;if(!confirm('この本の受信済み共有ファイルを置き換えます。端末へ送りますか？'))return;busy=true;controls();status.textContent='共有ファイルを送信中…';try{const form=new FormData();form.append('file',selectedFile);const response=await checkedResponse(await request('/api/sync/upload?book='+encodeURIComponent(book),{method:'POST',body:form}));status.textContent=await response.text();}catch(error){status.textContent='送信結果を確認できません: '+error.message+'\n通信が切れた場合は再接続して確認してください。読書データの適用には端末での確認が必要です。';}finally{busy=false;controls();}});
initialize();
</script></body></html>
