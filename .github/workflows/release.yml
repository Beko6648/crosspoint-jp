name: Compile Release

on:
  push:
    tags:
      - 'yomuka-v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#yomuka-}"
          sed -i "s/^version = .*/version = ${VERSION}/" platformio.ini
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building with version: ${VERSION}"

      - name: Build Yomuka
        run: |
          set -euo pipefail
          pio run -e gh_release

          firmware="$(find .pio/build -maxdepth 3 -type f -path "*/firmware.bin" | grep "/gh_release/" | head -n1)"
          bootloader="$(find .pio/build -maxdepth 3 -type f -path "*/bootloader.bin" | grep "/gh_release/" | head -n1)"
          partitions="$(find .pio/build -maxdepth 3 -type f -path "*/partitions.bin" | grep "/gh_release/" | head -n1)"

          if [ -z "${firmware}" ] || [ -z "${bootloader}" ] || [ -z "${partitions}" ]; then
            echo "Expected gh_release artifacts not found."
            find .pio/build -maxdepth 4 -type f | sort || true
            exit 1
          fi

          cp "${firmware}" "Yomuka-${RELEASE_VERSION}-firmware.bin"
          cp "${bootloader}" "Yomuka-${RELEASE_VERSION}-bootloader.bin"
          cp "${partitions}" "Yomuka-${RELEASE_VERSION}-partitions.bin"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yomuka-${{ env.RELEASE_VERSION }}
          path: |
            Yomuka-${{ env.RELEASE_VERSION }}-firmware.bin
            Yomuka-${{ env.RELEASE_VERSION }}-bootloader.bin
            Yomuka-${{ env.RELEASE_VERSION }}-partitions.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrossPoint Yomuka ${{ env.RELEASE_VERSION }}
          files: |
            Yomuka-${{ env.RELEASE_VERSION }}-firmware.bin
            Yomuka-${{ env.RELEASE_VERSION }}-bootloader.bin
            Yomuka-${{ env.RELEASE_VERSION }}-partitions.bin
          body: |
            ## CrossPoint Yomuka ${{ github.ref_name }}

            ### ファームウェア

            | ファイル | 用途 |
            |---|---|
            | `Yomuka-${{ env.RELEASE_VERSION }}-firmware.bin` | 通常のSDカード更新用 |
            | `Yomuka-${{ env.RELEASE_VERSION }}-bootloader.bin` | 復旧・開発時のみ使用 |
            | `Yomuka-${{ env.RELEASE_VERSION }}-partitions.bin` | 復旧・開発時のみ使用 |

            ### インストール方法

            1. 通常の更新は、`Yomuka-${{ env.RELEASE_VERSION }}-firmware.bin` をSDカードの更新手順に従って使用します。
            2. 詳細は README と基本操作ガイドを確認してください。
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
