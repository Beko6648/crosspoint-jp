name: Build & Publish SD Card Fonts

# Fonts change rarely — run manually when font sources or the conversion
# pipeline are updated. Publishes individual .cpfont files for device downloads
# and SD-ready per-family ZIP archives under the fixed "sd-fonts" tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Font catalog, converter, codepoint ranges, and dependencies.
      - 'lib/EpdFont/scripts/**'
      # Committed source fonts can be selected by sd-fonts.yaml entries.
      - 'lib/EpdFont/builtinFonts/source/**'
      - 'scripts/generate-font-manifest.py'
      # Run once when the publishing workflow itself changes.
      - '.github/workflows/release-fonts.yml'

jobs:
  build-fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to create/update the release

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install font tools
        run: pip install freetype-py fonttools pyyaml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev

      - name: Build SD card fonts
        run: python3 lib/EpdFont/scripts/build-sd-fonts.py --clean

      - name: Flatten output for release assets
        run: |
          mkdir -p dist
          find lib/EpdFont/scripts/output -name '*.cpfont' -exec cp {} dist/ \;

      - name: Package SD-ready font archives
        run: |
          set -euo pipefail
          mkdir -p packages
          for family_dir in lib/EpdFont/scripts/output/*; do
            [ -d "${family_dir}" ] || continue
            family="$(basename "${family_dir}")"
            install_dir="packages/${family}/.fonts/${family}"
            mkdir -p "${install_dir}"
            cp "${family_dir}"/*.cpfont "${install_dir}/"
            (
              cd "packages/${family}"
              zip -q -r "${GITHUB_WORKSPACE}/dist/Yomuka-Font-${family}.zip" .fonts
            )
          done

      - name: Generate manifest
        run: >
          python3 scripts/generate-font-manifest.py
          --input dist
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fonts/"
          --output dist/fonts.json
          --descriptions-from lib/EpdFont/scripts/sd-fonts.yaml

      - name: Package font licenses and attributions
        run: >
          python3 scripts/package-font-licenses.py
          --output dist/FONT-LICENSES.zip

      - name: Update docs/fonts.json for gh-pages
        run: cp dist/fonts.json docs/fonts.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fonts.json
          if ! git diff --cached --quiet; then
            git commit -m "✏️ フォントマニフェスト自動更新"
            git pull --rebase origin main
            git push
          fi

      - name: Publish to sd-fonts release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: sd-fonts
          name: SD Card Fonts
          body: |
            CrossPoint Yomuka向けのSDカードフォントです。

            ## 推奨：PCでZIPをSDカードへ展開

            1. 使用したい `Yomuka-Font-<フォント名>.zip` をダウンロードします。
            2. ZIPをSDカード直下へ展開します。
            3. `/.fonts/<フォント名>/` にフォントが配置されたことを確認します。
            4. SDカードを端末へ戻して再起動し、読書フォント設定から選択します。

            日本語フォントは容量が大きいため、この方法を推奨します。

            ## 端末からダウンロード

            **設定 > システム > フォントをダウンロード**からも導入できますが、
            日本語フォントは完了まで時間がかかる場合があります。

            `FONT-LICENSES.zip`にはOFL 1.1本文と各フォントの出典情報が含まれます。
          files: dist/*
          make_latest: false    # don't override the latest firmware release
